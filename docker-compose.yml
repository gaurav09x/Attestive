name: attestive

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-attestive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attestive}
      POSTGRES_DB: ${POSTGRES_DB:-attestive}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attestive} -d ${POSTGRES_DB:-attestive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:-local-compose-development-secret-key-change-me}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-attestive}:${POSTGRES_PASSWORD:-attestive}@db:5432/${POSTGRES_DB:-attestive}
      FRONTEND_ORIGIN: http://localhost:5173
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m app.cli init && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
